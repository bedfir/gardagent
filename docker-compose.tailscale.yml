# Private access to the gateway from your Tailscale devices (phone, laptop), without exposure on the Internet.
# Start: docker compose -f docker-compose.yml -f docker-compose.tailscale.yml up -d
# Authentication: either TS_AUTHKEY in .env, or without a key by opening the login link shown in "docker compose logs tailscale".
# Then browse to: http://gardagent/console/ (MagicDNS) from a device connected to the same Tailscale network.
services:
  tailscale:
    image: tailscale/tailscale:stable
    hostname: gardagent
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: gardagent
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tsstate:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  tsstate:
