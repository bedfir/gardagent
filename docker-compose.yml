services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gardagent
      POSTGRES_USER: gardagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gardagent -d gardagent"]
      interval: 5s
      retries: 10

  gateway:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://gardagent:${POSTGRES_PASSWORD}@postgres:5432/gardagent
    volumes:
      - ledger_spool:/app/spool
    ports:
      # Loopback only: /admin and /console must not be reachable from the network by default.
      - "127.0.0.1:8080:8080"

volumes:
  pgdata:
  ledger_spool:
